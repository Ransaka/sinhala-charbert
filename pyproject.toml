[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sinhala-charbert"
version = "0.1.0"
description = "Dual-Channel Transformer for Sinhala Typo Detection, Correction, and Robust NLU"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ransaka" }
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sinlib>=0.2.4",
    "datasets>=2.14.0",
    "evaluate>=0.4.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.0.280",
]

[tool.setuptools.packages.find]
where = ["src"]
